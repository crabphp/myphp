# static-php-cli recipe for the full myphp runtime (myphp-full): build/craft.yml plus
# HTTPS, SQLite, XML and more. Keep the extra list in sync with cli/runtime.php.
php-version: 8.4
extensions: glfw,opcache,phar,mbstring,ctype,tokenizer,zlib,posix,pcntl,filter,openssl,curl,pdo,pdo_sqlite,sqlite3,fileinfo,iconv,dom,xml,simplexml,xmlreader,xmlwriter,bcmath,sockets
sapi:
  - cli
  - micro
