# static-php-cli recipe for the macOS myphp runtime: build/craft.yml plus FFI,
# which loads AccessKit for VoiceOver (src/AccessKit.php).
php-version: 8.4
extensions: glfw,opcache,phar,mbstring,ctype,tokenizer,zlib,posix,pcntl,openssl,curl,pdo,pdo_sqlite,sqlite3,filter,fileinfo,iconv,dom,xml,simplexml,xmlreader,xmlwriter,bcmath,sockets,ffi
sapi:
  - cli
  - micro
