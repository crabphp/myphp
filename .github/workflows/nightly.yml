name: Nightly

# Every push to main builds all platforms and replaces the files of the "nightly"
# prerelease, so `myphp upgrade --nightly` gets unreleased work. Releases are not
# affected: install.sh and `myphp upgrade` use the latest real release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - cli/**
      - assets/**
      - examples/**
      - build/**
      - install.*
      - .github/workflows/**

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Publishes the platforms that built, so one failing platform does not hold back the others.
  publish:
    needs: [version, linux, macos, windows]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move the nightly tag and replace its files
        run: |
          mkdir files
          find artifacts -path '*/dist/*' -type f -exec cp {} files/ \;
          ls -l files
          [ -n "$(ls files)" ] || { echo 'No platform built'; exit 1; }
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          NOTES="Built from ${GITHUB_SHA::7} ($VERSION). Unreleased work from main: install with \`myphp upgrade --nightly\`."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$NOTES"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$NOTES" --verify-tag
          fi
          gh release upload nightly files/* --clobber
