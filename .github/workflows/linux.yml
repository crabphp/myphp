name: Linux binary

# Builds myphp for Linux x86-64 on CI. Releases still attach the binary built by
# build/release.sh; nightly.yml uses this one.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/linux.yml
      - build/craft.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ASSET: myphp-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 and OpenGL development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl-dev xvfb libgl1-mesa-dri imagemagick pkg-config > /dev/null

      - name: Restore the PHP runtime
        id: runtime
        uses: actions/cache@v4
        with:
          path: spc/buildroot/bin
          key: runtime-linux-x86_64-${{ hashFiles('build/craft.yml') }}

      - uses: shivammathur/setup-php@v2
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          php-version: '8.4'
          tools: composer

      # static-php-cli v3 (the commit the maintainer builds with) is the version that builds glfw on Linux.
      # glfw links X11 dynamically; the runtime targets glibc 2.17 so it runs on old distributions.
      - name: Build the PHP runtime with static-php-cli
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          # Sources come from GitHub; a token avoids its limit on anonymous downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --branch v3 https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc checkout -q b8de36c
          cd spc
          composer install -q --no-dev --no-interaction
          mkdir -p x11libs x11root/include
          for l in X11 Xrandr Xinerama Xcursor Xi; do ln -sf /usr/lib/x86_64-linux-gnu/lib$l.so x11libs/; done
          # Only the X11 headers: CMake would otherwise add /usr/include, and Ubuntu's newer
          # libc headers there clash with the glibc 2.17 headers the build targets.
          ln -s /usr/include/X11 x11root/include/X11
          export CMAKE_PREFIX_PATH=$PWD/x11root
          cp ../build/craft.yml .
          bin/spc doctor --auto-fix || true
          SPC_TARGET=native-native-gnu.2.17 SPC_CMD_VAR_PHP_MAKE_EXTRA_LDFLAGS="-L$PWD/x11libs" bin/spc craft -v \
            || { tail -n 80 craft.log 2>/dev/null; grep -rn -B3 -A12 -E 'error[: ]|undefined reference|ld: ' log 2>/dev/null | tail -200; exit 1; }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spc-logs
          path: spc/log/

      - name: Build myphp
        run: |
          PHP=$PWD/spc/buildroot/bin/php MYPHP_VERSION=${{ inputs.version || 'dev' }} build/make-myphp.sh spc/buildroot/bin/micro.sfx
          build/myphp version

      - name: Smoke test (init, build, install, open windows)
        run: |
          WORK=$(mktemp -d)
          cd "$WORK"
          "$GITHUB_WORKSPACE/build/myphp" init smoke
          cd smoke
          "$GITHUB_WORKSPACE/build/myphp" build
          MYPHP_DOWNLOAD_URL=file://$GITHUB_WORKSPACE/build/myphp MYPHP_INSTALL_DIR=$WORK/bin sh "$GITHUB_WORKSPACE/install.sh"
          mkdir -p "$GITHUB_WORKSPACE/shots"
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c "
            PHPUI_SCREENSHOT=$GITHUB_WORKSPACE/shots/built-app.png ./build/smoke &&
            PHPUI_SCREENSHOT=$GITHUB_WORKSPACE/shots/gallery.png $GITHUB_WORKSPACE/build/myphp demo gallery"
          ls -l "$GITHUB_WORKSPACE/shots"
          test -s "$GITHUB_WORKSPACE/shots/gallery.png"

      - name: Package
        run: |
          mkdir -p dist
          cp build/myphp dist/$ASSET
          (cd dist && sha256sum $ASSET > $ASSET.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/
            shots/
