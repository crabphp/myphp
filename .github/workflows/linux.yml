name: Linux binary

# Builds myphp for Linux x86-64 on CI. Releases still attach the binary built by
# build/release.sh; nightly.yml uses this one.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/linux.yml
      - build/craft.yml
      - build/craft-full.yml
      - build/spc/**
      - ext/phpsdl/**

permissions:
  contents: read

jobs:
  # Two runtimes: myphp (core, small) and myphp-full (HTTPS, SQLite, XML...), see cli/runtime.php.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: core, name: myphp, recipe: build/craft.yml }
          - { flavor: full, name: myphp-full, recipe: build/craft-full.yml }
    runs-on: ubuntu-22.04
    env:
      ASSET: ${{ matrix.name }}-linux-x86_64
      MYPHP: build/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # SDL3 (phpsdl) loads X11, Wayland and D-Bus at run time; it needs their headers to
      # build, and D-Bus and IBus ones for input methods.
      - name: Install X11, Wayland, input-method and OpenGL development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libdbus-1-dev libibus-1.0-dev libgl-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 imagemagick pkg-config cmake > /dev/null
          # The runner ships older OpenSSL, libxml2, curl and SQLite development links, and the
          # glfw recipe puts the system library folder first: remove those links so the
          # runtime links the versions static-php-cli builds.
          for l in xml2 ssl crypto curl sqlite3 z lzma iconv; do sudo rm -f /usr/lib/x86_64-linux-gnu/lib$l.so /usr/lib/x86_64-linux-gnu/lib$l.a; done

      - name: Restore the PHP runtime
        id: runtime
        uses: actions/cache@v4
        with:
          path: spc/buildroot/bin
          key: runtime-linux-x86_64-${{ matrix.flavor }}-${{ hashFiles(matrix.recipe, 'ext/phpsdl/**', 'build/spc/**') }}

      - uses: shivammathur/setup-php@v2
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          php-version: '8.4'
          tools: composer

      # static-php-cli v3 builds myphp's own extension (ext/phpsdl, SDL3) from this checkout:
      # build/spc/install.php adds the SDL3 and phpsdl recipes. CI builds with the system GCC
      # against Ubuntu 22.04's glibc (2.35); zig's glibc 2.17 headers clash with the system ones.
      - name: Build the PHP runtime with static-php-cli
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          # Sources come from GitHub; a token avoids its limit on anonymous downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --branch v3 https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc checkout -q b8de36c
          cd spc
          composer install -q --no-dev --no-interaction
          php ../build/spc/install.php .
          cp ../${{ matrix.recipe }} craft.yml
          bin/spc doctor --auto-fix || true
          SPC_TOOLCHAIN='StaticPHP\Toolchain\GccNativeToolchain' SPC_TARGET=native-native-gnu bin/spc craft -v \
            || { tail -n 80 craft.log 2>/dev/null; grep -rn -B3 -A12 -E 'error[: ]|undefined reference|ld: ' log 2>/dev/null | tail -200; exit 1; }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spc-logs-${{ matrix.flavor }}
          path: spc/log/

      - name: Build myphp
        run: |
          PHP=$PWD/spc/buildroot/bin/php MYPHP_FLAVOR=${{ matrix.flavor }} MYPHP_VERSION=${{ inputs.version || 'dev' }} build/make-myphp.sh spc/buildroot/bin/micro.sfx
          $MYPHP version

      - name: Smoke test (init, build, install, open windows)
        run: |
          WORK=$(mktemp -d)
          cd "$WORK"
          "$GITHUB_WORKSPACE/$MYPHP" init smoke
          cd smoke
          "$GITHUB_WORKSPACE/$MYPHP" build
          MYPHP_DOWNLOAD_URL=file://$GITHUB_WORKSPACE/$MYPHP MYPHP_INSTALL_DIR=$WORK/bin sh "$GITHUB_WORKSPACE/install.sh"
          mkdir -p "$GITHUB_WORKSPACE/shots"
          xvfb-run -a -s '-screen 0 1600x1000x24' sh -c "
            PHPUI_SCREENSHOT=$GITHUB_WORKSPACE/shots/built-app.png ./build/smoke &&
            PHPUI_SCREENSHOT=$GITHUB_WORKSPACE/shots/showcase.png $GITHUB_WORKSPACE/$MYPHP run $GITHUB_WORKSPACE/examples/showcase.php &&
            MYPHP_GPU=1 PHPUI_SCREENSHOT=$GITHUB_WORKSPACE/shots/showcase-vulkan.png $GITHUB_WORKSPACE/$MYPHP run $GITHUB_WORKSPACE/examples/showcase.php"
          ls -l "$GITHUB_WORKSPACE/shots"
          test -s "$GITHUB_WORKSPACE/shots/showcase.png"
          # SDL_GPU on Mesa's software Vulkan draws what OpenGL draws (canvases aside, for now).
          test -s "$GITHUB_WORKSPACE/shots/showcase-vulkan.png"

      - name: Package
        run: |
          mkdir -p dist
          cp $MYPHP dist/$ASSET
          (cd dist && sha256sum $ASSET > $ASSET.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/
            shots/
