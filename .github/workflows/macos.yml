name: macOS binaries

# Builds myphp for macOS (the Linux binary is built locally by build/release.sh).
# On a published release the binaries are attached to it.
on:
  workflow_dispatch:
  # nightly.yml builds main and passes a version.
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
  release:
    types: [published]
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/macos.yml
      - build/craft-macos*.yml
      - build/spc/**
      - ext/phpsdl/**
      - src/AccessKit.php
      - build/make-myphp.*
      - cli/**
      - install.sh

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two runtimes: myphp (core, small) and myphp-full (HTTPS, SQLite, XML...), see cli/runtime.php.
          - { runner: macos-15, arch: arm64, spc: aarch64, flavor: core, name: myphp, recipe: build/craft-macos.yml }
          - { runner: macos-15-intel, arch: x86_64, spc: x86_64, flavor: core, name: myphp, recipe: build/craft-macos.yml }
          - { runner: macos-15, arch: arm64, spc: aarch64, flavor: full, name: myphp-full, recipe: build/craft-macos-full.yml }
          - { runner: macos-15-intel, arch: x86_64, spc: x86_64, flavor: full, name: myphp-full, recipe: build/craft-macos-full.yml }
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSET: ${{ matrix.name }}-macos-${{ matrix.arch }}
      MYPHP: build/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the PHP runtime
        id: runtime
        uses: actions/cache@v4
        with:
          path: spc/buildroot/bin
          key: runtime-macos-${{ matrix.arch }}-${{ matrix.flavor }}-${{ hashFiles(matrix.recipe, 'ext/phpsdl/**', 'build/spc/**') }}

      - uses: shivammathur/setup-php@v2
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          php-version: '8.4'
          tools: composer

      # static-php-cli v3 from source: it builds myphp's own extension (ext/phpsdl, SDL3)
      # from this checkout, with the SDL3 and phpsdl recipes from build/spc.
      - name: Build the PHP runtime with static-php-cli
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          git clone -q --branch v3 https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc checkout -q b8de36c
          cd spc
          composer install -q --no-dev --no-interaction
          php ../build/spc/install.php .
          cp ../${{ matrix.recipe }} craft.yml
          bin/spc doctor --auto-fix || true
          bin/spc craft -v || { tail -n 80 craft.log 2>/dev/null; grep -rn -B3 -A12 -E 'error[: ]|Undefined symbols|ld: ' log 2>/dev/null | tail -200; exit 1; }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spc-logs-macos-${{ matrix.arch }}-${{ matrix.flavor }}
          path: spc/log/

      # Screen readers: AccessKit's macOS library goes into the binary (assets/native),
      # and so into every app built with it.
      - name: Bundle AccessKit
        run: |
          gh release download 0.23.2 --repo AccessKit/accesskit-c --pattern '*.zip' --dir accesskit
          unzip -q accesskit/*.zip -d accesskit
          mkdir -p assets/native/macos-${{ matrix.arch }}
          cp accesskit/accesskit-c-*/lib/macos/${{ matrix.arch }}/shared/libaccesskit.dylib assets/native/macos-${{ matrix.arch }}/
          cp accesskit/accesskit-c-*/LICENSE-MIT assets/native/ACCESSKIT-LICENSE-MIT
          cp accesskit/accesskit-c-*/LICENSE-APACHE assets/native/ACCESSKIT-LICENSE-APACHE

      - name: Build myphp
        run: |
          VERSION=${{ inputs.version || 'dev' }}
          if [ "${{ github.event_name }}" = release ]; then VERSION=${{ github.event.release.tag_name }}; VERSION=${VERSION#v}; fi
          PHP=$PWD/spc/buildroot/bin/php MYPHP_FLAVOR=${{ matrix.flavor }} MYPHP_VERSION=$VERSION build/make-myphp.sh spc/buildroot/bin/micro.sfx
          file $MYPHP
          $MYPHP version
          # FFI works in the binary and the AccessKit bindings build a tree.
          $MYPHP run tests/accesskit.php

      - name: Smoke test (init, build, install)
        run: |
          WORK=$(mktemp -d)
          cd "$WORK"
          "$GITHUB_WORKSPACE/$MYPHP" init smoke
          cd smoke
          "$GITHUB_WORKSPACE/$MYPHP" build --dmg
          file build/smoke
          # An app bundle and a disk image, as a Mac app ships.
          test -x build/Smoke.app/Contents/MacOS/smoke
          plutil -lint build/Smoke.app/Contents/Info.plist
          test "$(head -c 4 build/Smoke.app/Contents/Resources/AppIcon.icns)" = icns
          codesign --verify --verbose build/Smoke.app || echo "::warning::the app bundle is not signed"
          hdiutil verify build/Smoke.dmg
          MYPHP_DOWNLOAD_URL=file://$GITHUB_WORKSPACE/$MYPHP MYPHP_INSTALL_DIR=$WORK/bin sh "$GITHUB_WORKSPACE/install.sh"
          echo "SMOKE=$WORK/smoke" >> "$GITHUB_ENV"

      # Hosted runners may not offer Metal to SDL_GPU, so a failure here is reported but not fatal.
      - name: Smoke test (open a window)
        continue-on-error: true
        run: |
          mkdir -p shots
          PHPUI_SCREENSHOT=$PWD/shots/built-app.png "$SMOKE/build/smoke"
          PHPUI_SCREENSHOT=$PWD/shots/bundled-app.png "$SMOKE/build/Smoke.app/Contents/MacOS/smoke"
          PHPUI_SCREENSHOT=$PWD/shots/demo.png $MYPHP run examples/showcase.php
          ls -l shots

      - name: Package
        run: |
          mkdir -p dist
          cp $MYPHP dist/$ASSET
          (cd dist && shasum -a 256 $ASSET > $ASSET.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/
            shots/

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/$ASSET dist/$ASSET.sha256 --clobber
